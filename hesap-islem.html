<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VAELO Hesap</title>
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F3F1EC;color:#0A0A0A;font:300 15px/1.65 Jost,"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  header{background:#0A0A0A;text-align:center;padding:26px 16px}
  header a{font:600 1.7rem/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.34em;color:#F3F1EC;text-decoration:none;padding-left:.34em}
  main{flex:1;display:flex;justify-content:center;padding:56px 20px 70px}
  .box{width:100%;max-width:420px}
  h1{font:500 2.1rem/1.15 "Cormorant Garamond",Georgia,serif;margin-bottom:12px}
  p{color:#3a3833}
  label{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#6B6861;margin:22px 0 6px}
  input{width:100%;padding:13px 12px;border:1px solid #DFDBD2;background:#fff;font:300 16px Jost,Helvetica,Arial,sans-serif;color:#0A0A0A;border-radius:0}
  input:focus{outline:none;border-color:#0A0A0A}
  .btn{display:block;width:100%;margin-top:24px;padding:16px;background:#0A0A0A;color:#F3F1EC;border:0;font:400 13px Jost,Helvetica,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-align:center;text-decoration:none}
  .btn[disabled]{opacity:.5;cursor:default}
  .err{color:#9b2c2c;font-size:.88rem;margin-top:14px;min-height:1.2em}
  .ok-ico{width:56px;height:56px;border:1px solid #0A0A0A;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:26px;font-size:22px}
  footer{text-align:center;font-size:.78rem;color:#6B6861;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid #DFDBD2}
  footer a{color:#6B6861}
</style>
</head>
<body>
<header><a href="/">VAĖLO</a></header>
<main><div class="box" id="kutu"><p>Yükleniyor…</p></div></main>
<footer>VAELO · <a href="/">vaelo.com.tr</a> · <a href="mailto:info@vaelo.com.tr">info@vaelo.com.tr</a></footer>
<script type="module">
import { auth, hataMetni } from '/assets/fb.js';
import { applyActionCode, verifyPasswordResetCode, confirmPasswordReset } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';

const kutu = document.getElementById('kutu');
const q = new URLSearchParams(location.search);
const mode = q.get('mode'), kod = q.get('oobCode');
const esc = (t) => String(t || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KOD_HATA = { 'auth/expired-action-code': 'Bu bağlantının süresi dolmuş.', 'auth/invalid-action-code': 'Bu bağlantı geçersiz ya da daha önce kullanılmış.' };

function sonuc(baslik, metin, dugme) {
  kutu.innerHTML = `<div class="ok-ico" aria-hidden="true">✓</div><h1>${baslik}</h1><p>${metin}</p>${dugme || '<a class="btn" href="/">Alışverişe Başla</a>'}`;
}
function hata(e, ek) {
  kutu.innerHTML = `<h1>Bir sorun oluştu</h1><p>${esc(KOD_HATA[e && e.code] || hataMetni(e))} ${ek || ''}</p><a class="btn" href="/#hesap">Hesabım'a Git</a>`;
}

if (!kod) {
  kutu.innerHTML = '<h1>Bağlantı eksik</h1><p>Lütfen mailinizdeki bağlantıyı yeniden açın.</p><a class="btn" href="/">Ana Sayfa</a>';
} else if (mode === 'verifyEmail') {
  try {
    await applyActionCode(auth, kod);
    sonuc('E-postanız doğrulandı', 'Teşekkürler, hesabınız artık güvence altında.', '<a class="btn" href="/">Siteye Dön</a><a class="btn" style="background:transparent;color:#0A0A0A;border:1px solid #0A0A0A;margin-top:10px" href="/admin.html">Yönetim Paneli</a>');
  } catch (e) { hata(e, 'Yeni bir doğrulama maili isteyebilirsiniz.'); }
} else if (mode === 'resetPassword') {
  try {
    const email = await verifyPasswordResetCode(auth, kod);
    kutu.innerHTML = `<h1>Yeni şifrenizi belirleyin</h1><p>${esc(email)} hesabı için yeni bir şifre oluşturun.</p>
      <form id="f" novalidate><label for="s1">Yeni şifre</label><input id="s1" type="password" autocomplete="new-password" placeholder="En az 8 karakter">
      <label for="s2">Yeni şifre (tekrar)</label><input id="s2" type="password" autocomplete="new-password">
      <p class="err" id="err" aria-live="polite"></p><button class="btn" type="submit">Şifremi Kaydet</button></form>`;
    const f = document.getElementById('f'), err = document.getElementById('err');
    f.onsubmit = async (ev) => {
      ev.preventDefault(); err.textContent = '';
      const a = f.s1.value, b = f.s2.value;
      if (a.length < 8) { err.textContent = 'Şifre en az 8 karakter olmalı.'; return; }
      if (a !== b) { err.textContent = 'İki şifre birbiriyle aynı değil.'; return; }
      const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Kaydediliyor…';
      try { await confirmPasswordReset(auth, kod, a); sonuc('Şifreniz yenilendi', 'Yeni şifrenizle giriş yapabilirsiniz.', '<a class="btn" href="/#hesap">Giriş Yap</a>'); }
      catch (e) { err.textContent = KOD_HATA[e.code] || hataMetni(e); btn.disabled = false; btn.textContent = 'Şifremi Kaydet'; }
    };
  } catch (e) { hata(e, 'Giriş ekranındaki "Şifremi unuttum" ile yeni bir bağlantı isteyebilirsiniz.'); }
} else {
  kutu.innerHTML = '<h1>Geçersiz bağlantı</h1><p>Lütfen mailinizdeki bağlantıyı yeniden açın.</p><a class="btn" href="/">Ana Sayfa</a>';
}
</script>
</body>
</html>
