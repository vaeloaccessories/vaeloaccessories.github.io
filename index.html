<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAELO — Premium Apparel & T-Shirts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            line-height: 1.6;
        }
        header {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .logo img {
            height: 45px; /* Logonun yüksekliğini buradan ayarlayabilirsin */
            width: auto;
            display: block;
        }
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%);
        }
        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .hero p {
            color: #888;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        .products {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .product-card {
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: #444;
        }
        .product-img {
            width: 100%;
            height: 340px;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-info {
            padding: 20px;
        }
        .product-title {
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .product-price {
            color: #10b981;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .buy-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .buy-btn:hover {
            background-color: #ddd;
        }
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #222;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="#"><img src="logo.png" alt="VAELO Logo"></a>
        </div>
    </header>

    <section class="hero">
        <h1>NEW COLLECTION</h1>
        <p>Sokak modasına yön veren özel tasarım T-Shirt koleksiyonumuz keşfedilmeyi bekliyor.</p>
    </section>

    <section class="products">
        <!-- Ürün 1 -->
        <div class="product-card">
            <div class="product-img">
                <img src="tshirt1.jpg" alt="VAELO Oversize Heavyweight Tee">
            </div>
            <div class="product-info">
                <div class="product-title">VAELO Oversize Heavyweight Tee</div>
                <div class="product-price">499 TL</div>
                <a href="https://www.shopier.com" target="_blank" class="buy-btn">Satın Al</a>
            </div>
        </div>

        <!-- Ürün 2 -->
        <div class="product-card">
            <div class="product-img">
                <img src="tshirt2.jpg" alt="VAELO Acid Wash Graphic Tee">
            </div>
            <div class="product-info">
                <div class="product-title">VAELO Acid Wash Graphic Tee</div>
                <div class="product-price">549 TL</div>
                <a href="https://www.shopier.com" target="_blank" class="buy-btn">Satın Al</a>
            </div>
        </div>

        <!-- Ürün 3 -->
        <div class="product-card">
            <div class="product-img">
                <img src="tshirt3.jpg" alt="VAELO Minimal Logo Tee">
            </div>
            <div class="product-info">
                <div class="product-title">VAELO Minimal Logo Tee</div>
                <div class="product-price">449 TL</div>
                <a href="https://www.shopier.com" target="_blank" class="buy-btn">Satın Al</a>
            </div>
        </div>
    </section>

    <footer>
        &copy; 2026 VAELO. Tüm hakları saklıdır.
    </footer>

</body>
</html>
