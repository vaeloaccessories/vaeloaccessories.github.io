<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAELO — Premium Apparel & T-Shirts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        body {
            --heading-font: "Marcellus", Roboto, sans-serif;
            --heading-font-weight: 400;
            --heading-color: #ffffff;
            --heading-line-height: 1.24;
            --bs-body-font-family: "Jost", Roboto, sans-serif;
            --bs-body-font-size: 18px;
            --bs-body-color: #8f8f8f;
            --bs-primary: #8C907E;
            background-color: #0d0d0d;
            color: var(--bs-body-color);
            font-family: var(--bs-body-font-family);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .logo-text {
            font-family: var(--heading-font);
            font-size: 1.8rem;
            color: #fff;
            text-decoration: none;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(180deg, #161616 0%, #0d0d0d 100%);
        }

        .hero h1 {
            font-family: var(--heading-font);
            font-size: 3.5rem;
            color: var(--heading-color);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .hero p {
            color: #888;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .products {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-item {
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .product-item:hover {
            transform: translateY(-5px);
            border-color: #444;
        }

        .image-zoom-effect {
            display: flex;
            overflow: hidden;
            height: 380px;
            background-color: #1a1a1a;
        }

        .image-zoom-effect .image-holder {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .image-zoom-effect img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .image-zoom-effect:hover img {
            transform: scale(1.08);
        }

        .product-info {
            padding: 20px;
        }

        .product-title {
            font-family: var(--heading-font);
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 8px;
        }

        .product-price {
            color: var(--bs-primary);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            transition: background 0.2s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            box-sizing: border-box;
        }

        .buy-btn:hover {
            background-color: #cccccc;
        }

        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #222;
            color: #555;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo resmi yoksa şık bir metin logosu gösterir -->
        <a href="#" class="logo-text">VAELO</a>
    </header>

    <section class="hero">
        <h1>NEW COLLECTION</h1>
        <p>Sokak modasına yön veren özel tasarım T-Shirt koleksiyonumuz keşfedilmeyi bekliyor.</p>
    </section>

    <section class="products">
        <!-- Ürün 1 -->
        <div class="product-item">
            <div class="image-zoom-effect">
                <div class="image-holder">
                    <!-- BURAYA KENDİ ÜRÜN RESMİNİZİN INTERNET LINKINI YAZIN -->
                    <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=600" alt="VAELO Heavyweight Tee">
                </div>
            </div>
            <div class="product-info">
                <div class="product-title">VAELO Heavyweight Black Tee</div>
                <div class="product-price">499 TL</div>
                <a href="#" target="_blank" class="buy-btn">Satın Al</a>
            </div>
        </div>

        <!-- Ürün 2 -->
        <div class="product-item">
            <div class="image-zoom-effect">
                <div class="image-holder">
                    <img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=600" alt="VAELO Graphic Tee">
                </div>
            </div>
            <div class="product-info">
                <div class="product-title">VAELO Oversize Graphic Tee</div>
                <div class="product-price">549 TL</div>
                <a href="#" target="_blank" class="buy-btn">Satın Al</a>
            </div>
        </div>

        <!-- Ürün 3 -->
        <div class="product-item">
            <div class="image-zoom-effect">
                <div class="image-holder">
                    <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=600" alt="VAELO Minimal Tee">
                </div>
            </div>
            <div class="product-info">
                <div class="product-title">VAELO Minimal Signature Tee</div>
                <div class="product-price">449 TL</div>
                <a href="#" target="_blank" class="buy-btn">Satın Al</a>
            </div>
        </div>
    </section>

    <footer>
        &copy; 2026 VAELO. Tüm hakları saklıdır.
    </footer>

</body>
</html>
