<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa bulunamadı | VAELO</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--black:#0A0A0A;--paper:#F3F1EC;--sand:#DFDBD2;--muted:#6B6861;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.16,.84,.24,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--black);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit}
  header{display:flex;justify-content:space-between;align-items:center;padding:22px 16px;max-width:1000px;width:100%;margin:0 auto}
  .logo{font-family:var(--serif);font-size:28px;letter-spacing:6px;text-decoration:none}
  .back{font-size:13px;letter-spacing:1px;text-decoration:none;color:var(--muted)}
  main{flex:1;max-width:1000px;width:100%;margin:0 auto;padding:30px 16px 60px;text-align:center}
  .num{font-family:var(--serif);font-style:italic;font-size:clamp(5rem,22vw,10rem);line-height:1;color:var(--sand);animation:up 1.2s var(--ease) both}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.15;margin:6px 0 12px;animation:up 1.2s var(--ease) .15s both}
  p{font-size:.98rem;line-height:1.7;color:#3a3833;max-width:34em;margin:0 auto;animation:up 1.2s var(--ease) .3s both}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:40px auto 0;max-width:640px;animation:up 1.2s var(--ease) .45s both}
  .door{position:relative;display:flex;align-items:flex-end;aspect-ratio:3/4;overflow:hidden;text-decoration:none;color:#fff;padding:16px;text-align:left;isolation:isolate}
  .door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.4s var(--ease)}
  .door::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,10,10,0) 35%,rgba(10,10,10,.78))}
  .door:hover img{transform:scale(1.05)}
  .door span{display:block;font-family:var(--serif);font-size:1.5rem;line-height:1.1}
  .door small{display:block;margin-top:6px;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
  .home{display:inline-block;margin-top:34px;padding:15px 34px;background:var(--black);color:var(--paper);text-decoration:none;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
  .help{margin-top:22px;font-size:.88rem;color:var(--muted)}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:28px 16px;border-top:1px solid var(--sand)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">VAĖLO</a>
  <a class="back" href="/">← Ana sayfa</a>
</header>
<main>
  <div class="num" aria-hidden="true">404</div>
  <h1>Aradığın sayfa burada değil.</h1>
  <p>Bağlantı değişmiş ya da kaldırılmış olabilir. Koleksiyonlarımıza buradan devam edebilirsin.</p>
  <div class="doors">
    <a class="door" href="/#signature"><img src="/assets/signature-bg.webp" alt=""><div><span>Signature Premium</span><small>Keşfet →</small></div></a>
    <a class="door" href="/#street"><img src="/assets/street-bg.webp" alt=""><div><span>Street Division</span><small>Keşfet →</small></div></a>
  </div>
  <a class="home" href="/">Ana Sayfaya Dön</a>
  <p class="help">Yardım mı lazım? <a href="https://wa.me/905513708320" target="_blank" rel="noopener">WhatsApp'tan bize yaz</a>.</p>
</main>
<footer>© 2026 VAĖLO. Tüm hakları saklıdır.</footer>
</body>
</html>
