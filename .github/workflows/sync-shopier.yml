name: Shopier ürünlerini güncelle

# Her 30 dakikada bir Shopier mağazasını okur ve products.json dosyasını yeniler.
# Elle çalıştırmak için: Actions sekmesi > bu iş > Run workflow
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Shopier ürünlerini oku
        env:
          SHOPIER_TOKEN: ${{ secrets.SHOPIER_TOKEN }}
        run: |
          cat > /tmp/sync.mjs <<'EOF'
          import fs from 'node:fs';

          const STORE = 'https://www.shopier.com/VAELOaccessories';
          const UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          let useReader = false;   // Shopier bazen GitHub sunucularını engelliyor; o zaman ücretsiz okuyucu servis üzerinden okunur

          async function fetchText(url, headers) {
            const r = await fetch(url, { headers });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          }

          export async function get(url) {
            const base = { 'user-agent': UA, 'accept-language': 'tr-TR,tr;q=0.9' };
            const errors = [];
            if (!useReader) {
              try { return await fetchText(url, base); } catch (e) { errors.push('doğrudan: ' + e.message); useReader = true; console.log('Doğrudan okuma olmadı (' + e.message + '), okuyucu servis deneniyor'); }
            }
            for (let i = 0; i < 2; i++) {
              try {
                await sleep(1500);
                const t = await fetchText('https://r.jina.ai/' + url, { ...base, 'x-return-format': 'html' });
                if (t.length < 500) throw new Error('cevap çok kısa');
                return t;
              } catch (e) { errors.push('okuyucu: ' + e.message); }
            }
            throw new Error(url + ' okunamadı (' + errors.join('; ') + ')');
          }

          const dec = (s) => s.replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#0*39;/g, "'")
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ');

          export function metas(html) {
            const o = {};
            for (const m of html.matchAll(/<meta\b[^>]*>/gi)) {
              const k = (m[0].match(/(?:property|name)=["']([^"']+)["']/i) || [])[1];
              const c = (m[0].match(/content=["']([^"']*)["']/i) || [])[1];
              if (k && c !== undefined && !(k in o)) o[k] = dec(c);
            }
            return o;
          }

          export function textOf(html) {
            return dec(html
              .replace(/<script[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style[\s\S]*?<\/style>/gi, ' ')
              .replace(/<(?:br|\/p|\/div|\/li|\/h\d|\/tr|\/ul)\b[^>]*>/gi, '\n')
              .replace(/<[^>]+>/g, ' '))
              .replace(/[ \t\u00a0]+/g, ' ')
              .replace(/\s*\n\s*/g, '\n');
          }

          export function describe(html) {
            const t = textOf(html);
            const mark = 'Teslimat bilgisi';
            const idxs = [];
            for (let i = t.indexOf(mark); i >= 0; i = t.indexOf(mark, i + 1)) idxs.push(i);
            for (const i of idxs.reverse()) {
              const e = t.indexOf('Kargo ücreti', i);
              if (e > 0 && e - i < 4000) {
                const lines = t.slice(i + mark.length, e).split('\n')
                  .map((l) => l.trim().replace(/^Ürün Açıklaması:?\s*/i, '').trim())
                  .filter((l) => l && !/^Ürün açıklaması$/i.test(l));
                const out = lines.join('\n').slice(0, 1500);
                return out.length >= 10 ? out : '';
              }
            }
            return '';
          }

          export function parseProduct(html, id) {
            const m = metas(html);
            const title = m['og:title'] || m['name'] || ((html.match(/<title>([^<]*)<\/title>/i) || [])[1] || '').split('|')[0].trim();
            let price = Number(m['product:price:amount']);
            if (!price) price = Number(((textOf(html).match(/(\d[\d.]*)\s*TL/) || [])[1] || '').replace(/\./g, '')) || 0;
            const images = [...new Set([...html.matchAll(/https:\/\/cdn\.shopier\.app\/pictures_large\/[A-Za-z0-9_\-]+\.(?:jpg|jpeg|png|webp)/g)].map((x) => x[0]))];
            if (m['og:image'] && !images.includes(m['og:image'])) images.unshift(m['og:image']);
            const ship = Number((((textOf(html).match(/Kargo ücreti:?\s*([\d.,]+)\s*TL/i) || [])[1]) || '').replace(/\./g, '').replace(',', '.')) || 0;
            return { id, name: title, price, images: images.slice(0, 2), description: describe(html), url: STORE + '/' + id, ship };
          }

          export function productIds(html) {
            const ids = [];
            for (const m of html.matchAll(/(?:https?:\/\/www\.shopier\.com)?\/VAELOaccessories\/(\d{5,})/gi)) if (!ids.includes(m[1])) ids.push(m[1]);
            return ids;
          }


          // ---------- Resmi Shopier API (Kişisel Erişim Anahtarı ile) ----------
          export function parsePrice(x) {
            let t = String(x == null ? '' : x).trim();
            if (/,\d{1,2}$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
            const n = Number(t);
            return Number.isFinite(n) ? n : 0;
          }

          export function htmlToText(h) {
            return dec(String(h || '').replace(/<(?:br|\/p|\/div|\/li|\/h\d|\/ul)\b[^>]*>/gi, '\n').replace(/<[^>]+>/g, ' '))
              .replace(/[ \t\u00a0]+/g, ' ').split('\n').map((l) => l.trim()).filter(Boolean).join('\n').slice(0, 1500);
          }

          export function mapApiProduct(p) {
            const pd = p.priceData || {};
            const price = parsePrice(pd.discount && pd.discountedPrice ? pd.discountedPrice : pd.price);
            const images = (p.media || []).filter((m) => m && m.url && (!m.type || /image/i.test(m.type)))
              .sort((a, b) => (a.placement || 0) - (b.placement || 0)).map((m) => m.url).slice(0, 2);
            const url = /^https:\/\/www\.shopier\.com\//.test(p.url || '') ? p.url : STORE + '/' + p.id;
            return { id: String(p.id), name: p.title || '', price, images, description: htmlToText(p.description), url, ship: parsePrice(pd.shippingPrice) };
          }

          const API_UAS = [
            'shopier-go/1.0.0',
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
          ];

          export function cleanToken(t) {
            return String(t || '').trim().replace(/^bearer\s+/i, '').replace(/^["']+|["']+$/g, '').trim();
          }

          async function apiFetch(token, path) {
            let last = '';
            for (const ua of API_UAS) {
              const r = await fetch('https://api.shopier.com/v1' + path, {
                headers: { authorization: 'Bearer ' + token, accept: 'application/json', 'user-agent': ua },
              });
              const txt = await r.text();
              console.log('API ' + path + ' -> HTTP ' + r.status + ' | tarayıcı adı: ' + ua.slice(0, 10) + ' | sunucu: ' + (r.headers.get('server') || '-') + ' | tür: ' + (r.headers.get('content-type') || '-'));
              if (r.ok) return txt;
              last = 'HTTP ' + r.status + ' ' + txt.slice(0, 300);
              if (r.status !== 403) break;
            }
            throw new Error('Shopier API ' + last);
          }

          export async function fromApi(token) {
            const all = [];
            for (let page = 1; page <= 20; page++) {
              const txt = await apiFetch(token, '/products?page=' + page + '&limit=50');
              let body; try { body = JSON.parse(txt); } catch { throw new Error('Shopier API cevabı okunamadı: ' + txt.slice(0, 200)); }
              const items = Array.isArray(body) ? body : (body.data || body.items || body.products || []);
              if (!items.length && page === 1) console.log('Beklenmeyen cevap: ' + txt.slice(0, 400));
              all.push(...items);
              if (items.length < 50) break;
            }
            return all.map(mapApiProduct);
          }

          async function main() {
            let products = [];
            if (process.env.SHOPIER_TOKEN) {
              const token = cleanToken(process.env.SHOPIER_TOKEN);
              console.log('Resmi Shopier API kullanılıyor | anahtar uzunluğu: ' + token.length + ' | içinde boşluk var mı: ' + (/\s/.test(token) ? 'evet' : 'hayır'));
              products = (await fromApi(token)).filter((p) => p.name && p.price && p.images.length);
            } else {
              console.log('SHOPIER_TOKEN yok, mağaza sayfası okunuyor');
              const storeHtml = await get(STORE);
              const ids = productIds(storeHtml);
              if (!ids.length) { console.log('Sayfanın başı: ' + textOf(storeHtml).slice(0, 300).replace(/\n/g, ' ')); throw new Error('Mağaza sayfasında ürün bulunamadı'); }
              for (const id of ids) {
                const p = parseProduct(await get(STORE + '/' + id), id);
                if (p.name && p.price && p.images.length) products.push(p);
                else console.log('Atlandı (eksik bilgi):', id);
              }
            }
            if (!products.length) throw new Error('Hiçbir ürün okunamadı');
            const shipping = (products.find((p) => p.ship) || {}).ship || 0;
            const data = { shipping, products: products.map(({ ship, ...p }) => p) };
            fs.writeFileSync('products.json', JSON.stringify(data, null, 2) + '\n');
            console.log(products.length + ' ürün yazıldı');
          }

          if (!process.env.VAELO_TEST) main().catch((e) => { console.error(e.message); process.exit(1); });
          EOF
          node /tmp/sync.mjs

      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain products.json)" ]; then
            git config user.name "vaelo-sync"
            git config user.email "actions@users.noreply.github.com"
            git add products.json
            git commit -m "Shopier ürünleri güncellendi"
            git push
          fi
