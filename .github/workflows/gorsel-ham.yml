name: Ham görselleri indir (geçici)
on:
  push:
    branches: [gorsel-ham]
    paths: ['.github/workflows/gorsel-ham.yml']
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: gorsel-ham }
      - run: |
          mkdir -p ham
          python3 - <<'PY'
          import json, urllib.request
          d = json.load(open('products.json'))
          for p in d['products']:
              for i, u in enumerate(p['images']):
                  ext = u.rsplit('.', 1)[-1]
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'})
                  open(f"ham/{p['id']}_{i}.{ext}", 'wb').write(urllib.request.urlopen(req, timeout=60).read())
          PY
          ls -la ham
          git config user.name vaelo-sync; git config user.email actions@users.noreply.github.com
          git add ham && git commit -m "ham görseller" && git push
